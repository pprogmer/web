name: bgremover

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U app
      interval: 2s
      retries: 30

  server1:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      SERVER_NAME: server1
      ADMIN_EMAIL: admin@admin.com
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

  server2:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      SERVER_NAME: server2
      ADMIN_EMAIL: admin@admin.com
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

  balancer:
    build:
      context: .
      dockerfile: balancer/Dockerfile
    environment:
      SERVERS: http://server1:3000,http://server2:3000
    ports:
      - 8080:8080
    depends_on:
      - server1
      - server2

volumes:
  pgdata:
