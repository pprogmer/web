name: bgremover

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U app
      interval: 2s
      retries: 30

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    ports:
      - 8080:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
